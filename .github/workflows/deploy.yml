name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          
      # 要約アプリをビルド
      - run: npm install
      - run: npm run build

      # 単語クイズアプリをビルドして dist/vocab-quiz/ に配置
      - run: npm install
        working-directory: vocab-quiz
      - run: npm run build
        working-directory: vocab-quiz
      - run: mv vocab-quiz/dist dist/vocab-quiz

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
